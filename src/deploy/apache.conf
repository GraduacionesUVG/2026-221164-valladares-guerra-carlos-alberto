ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    AllowOverride All
    # Vue Router usa history mode: toda ruta que no sea un archivo ni la API
    # se sirve con index.html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/Backend/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>

# Del backend solo se expone la API: todo lo demás (config, src, README,
# autoload.php) queda bloqueado. Las rutas se reescriben hacia
# api/v1/index.php, que es el único archivo permitido.
<Directory /var/www/html/Backend>
    Require all denied
</Directory>
<Directory /var/www/html/Backend/api/v1>
    Require all granted
</Directory>
